<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Simulação Embedded – Central SFR (MQTT.js)</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 1rem;
      }
      fieldset {
        margin-bottom: 1rem;
        padding: 1rem;
      }
      label {
        display: inline-block;
        width: 4rem;
        margin: 0.2rem 0.5rem;
      }
      input[type="number"],
      input[type="text"] {
        width: 4rem;
        margin-right: 0.5rem;
      }
      textarea {
        width: 100%;
        height: 150px;
        box-sizing: border-box;
      }
      button {
        margin: 0.5rem 0;
      }
      .led {
        display: inline-block;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        margin-left: 5px;
        vertical-align: middle;
      }
      .on {
        background: green;
      }
      .off {
        background: lightgray;
      }
    </style>

    <!-- MQTT.js via CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  </head>
  <body>
    <h1>Simulação Embedded – Central SFR (MQTT.js)</h1>

    <fieldset>
      <legend>LEDs de Status</legend>
      <div>Power: <span id="led-power" class="led off"></span></div>
      <div>Run (1 s): <span id="led-run" class="led off"></span></div>
      <div>Falha/Tx: <span id="led-falha" class="led off"></span></div>
    </fieldset>

    <fieldset>
      <legend>Threshold de Alarme (V)</legend>
      <input type="number" id="threshold" step="0.1" value="50" />
    </fieldset>

    <fieldset>
      <legend>Vetor Tensão Torre 1 (A)</legend>
      <div id="tower1-fields"></div>
      <button id="send-t1">Gerar &amp; Enviar Vetor A</button>
    </fieldset>

    <fieldset>
      <legend>Vetor Tensão Torre 2 (B)</legend>
      <div id="tower2-fields"></div>
      <button id="send-t2">Gerar &amp; Enviar Vetor B</button>
    </fieldset>

    <fieldset>
      <legend>Vetor SW (14 monitores)</legend>
      <div id="tower1-sw-fields"></div>
      <div id="tower2-sw-fields"></div>
      <button id="send-sw">Gerar &amp; Enviar Vetor SW</button>
    </fieldset>

    <fieldset>
      <legend>Comandos</legend>
      <button data-cmd="ACK" class="btn-cmd">ACK</button>
      <button data-cmd="RESET" class="btn-cmd">RESET</button>
      <button data-cmd="LAMP" class="btn-cmd">TESTE LÂMPADAS</button>
      <button data-cmd="STATUS" class="btn-cmd">STATUS</button>
    </fieldset>

    <fieldset>
      <legend>Log Serial (raw strings)</legend>
      <textarea id="log" readonly></textarea>
    </fieldset>

    <script>
      // === MQTT.js Config ===
      const MQTT_URL = "ws://54.211.31.145:8083";
      const TOPIC_PUB = "lindsay/pivo01";
      const TOPIC_SUB = "lindsay/comandos";

      const client = mqtt.connect(MQTT_URL, {
        clientId: "web_" + Math.random().toString(16).slice(2),
        reconnectPeriod: 1000,
        connectTimeout: 10000,
      });

      client.on("connect", () => {
        log("[MQTT] conectado via MQTT.js");
        client.subscribe(TOPIC_SUB, (err) => {
          log(
            err
              ? "[MQTT] falha ao inscrever"
              : `[MQTT] inscrito em "${TOPIC_SUB}"`,
          );
        });
      });

      client.on("message", (topic, message) => {
        log(`[MQTT←] ${topic}: ${message.toString()}`);
      });

      client.on("error", (err) => {
        log("[MQTT] erro: " + err.message);
      });

      function mqttPublish(raw) {
        if (!client.connected) {
          log("[MQTT] ERRO: cliente não conectado.");
          return;
        }
        client.publish(TOPIC_PUB, raw);
        log(`[MQTT→] ${TOPIC_PUB}: ${raw}`);
      }

      // === Simulação ===
      const sim = {
        power: false,
        runOn: true,
        timers: { run: Date.now() },
        id() {
          return "777777";
        },
        updateLEDs() {
          document.getElementById("led-power").className =
            `led ${this.power ? "on" : "off"}`;
          document.getElementById("led-run").className =
            `led ${this.runOn ? "on" : "off"}`;
        },
        loop() {
          const now = Date.now();
          if (!this.power) {
            this.power = true;
            log("Sistema: POWER ON");
          }
          if (now - this.timers.run > 1000) {
            this.runOn = !this.runOn;
            this.timers.run = now;
          }
          this.updateLEDs();
        },
      };

      window.addEventListener("DOMContentLoaded", () => {
        setInterval(() => sim.loop(), 100);

        for (let t = 1; t <= 2; t++) {
          const divV = document.getElementById(`tower${t}-fields`);
          for (let i = 1; i <= 7; i++) {
            const lbl = document.createElement("label");
            lbl.textContent = `M${i}:`;
            const inp = document.createElement("input");
            inp.type = "number";
            inp.step = "0.001";
            inp.value = "0";
            inp.id = `t${t}m${i}`;
            lbl.appendChild(inp);
            divV.appendChild(lbl);
          }
          const divS = document.getElementById(`tower${t}-sw-fields`);
          for (let i = 1; i <= 7; i++) {
            const lbl = document.createElement("label");
            lbl.textContent = `S${i}:`;
            const inp = document.createElement("input");
            inp.type = "text";
            inp.pattern = "[0-9]{3}";
            inp.value = "000";
            inp.id = `t${t}s${i}`;
            lbl.appendChild(inp);
            divS.appendChild(lbl);
          }
        }

        function nowTs() {
          const d = new Date();
          const p = (n) => String(n).padStart(2, "0");
          return (
            `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` +
            ` ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
          );
        }

        function blinkFalha() {
          const led = document.getElementById("led-falha");
          led.className = "led on";
          setTimeout(() => sim.updateLEDs(), 200);
        }

        function sendT(tower) {
          const id = sim.id() + (tower === 1 ? "A" : "B");
          const vals = Array.from(
            { length: 7 },
            (_, i) => document.getElementById(`t${tower}m${i + 1}`).value,
          );
          const raw = `${id};${vals.join(";")}`;
          log(raw);
          mqttPublish(raw);
          blinkFalha();
        }

        function sendSW() {
          const id = sim.id();
          const ts = nowTs();
          const pn1 = 0,
            pn2 = 0;
          const vals1 = Array.from(
            { length: 7 },
            (_, i) => document.getElementById(`t1s${i + 1}`).value,
          );
          const vals2 = Array.from(
            { length: 7 },
            (_, i) => document.getElementById(`t2s${i + 1}`).value,
          );
          const raw = [id, ts, pn1, pn2, ...vals1, ...vals2].join(";");
          log(raw);
          mqttPublish(raw);
          blinkFalha();
        }

        function sendCmd(cmd) {
          const raw = `${sim.id()};${nowTs()};${cmd}`;
          log(raw);
          mqttPublish(raw);
        }

        document.getElementById("send-t1").onclick = () => sendT(1);
        document.getElementById("send-t2").onclick = () => sendT(2);
        document.getElementById("send-sw").onclick = sendSW;
        document
          .querySelectorAll(".btn-cmd")
          .forEach((b) =>
            b.addEventListener("click", () => sendCmd(b.dataset.cmd)),
          );
      });

      function log(msg) {
        const L = document.getElementById("log");
        L.value += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        L.scrollTop = L.scrollHeight;
      }
    </script>
  </body>
</html>
